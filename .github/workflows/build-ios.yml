name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 🍎 Select Xcode 26 (Expo SDK 58 requires Xcode 26.4+)
        run: |
          ls /Applications/ | grep -i xcode
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: 🔨 Build iOS App (Unsigned Release)
        run: |
          WORKSPACE="ios/BooruViewer.xcworkspace"
          SCHEME="BooruViewer"
          echo "Building scheme: $SCHEME with workspace: $WORKSPACE"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package .ipa file
        run: |
          echo "=== Searching for .app bundle ==="
          APP_PATH=$(find build -name "*.app" -type d | grep -v ".xctest" | head -n 1)
          echo "Found app at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in build folder!"
            find build -maxdepth 4 -type d
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "BooruViewer.ipa" Payload
          ls -lh BooruViewer.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruViewer-iOS-IPA
          path: BooruViewer.ipa
          retention-days: 14
