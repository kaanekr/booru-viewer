name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 🔍 Verify iOS folder
        run: |
          echo "=== ios/ contents ==="
          ls -la ios/ || echo "No ios/ folder found!"
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          echo "Found workspace: $WORKSPACE"
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found!"
            exit 1
          fi

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: 🔨 Build iOS App (Unsigned Release)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME"
          echo "Workspace: $WORKSPACE"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build | grep -E "(error:|warning:|BUILD SUCCEEDED|BUILD FAILED|\.app)" | tail -50
          
          echo "=== Listing build output ==="
          find build/Build/Products -maxdepth 3 2>/dev/null || echo "No build/Build/Products found"


      - name: 📦 Package .ipa file
        run: |
          echo "=== Build Products ==="
          find build/Build/Products -name "*.app" 2>/dev/null || echo "No .app found in Build/Products"
          
          # Try both signed and unsigned output paths
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | grep -v ".xctest" | head -n 1)
          echo "Found app: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            find build -type d -name "*.app" 2>/dev/null
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "BooruViewer.ipa" Payload
          ls -lh BooruViewer.ipa


      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruViewer-iOS-IPA
          path: BooruViewer.ipa
          retention-days: 14
