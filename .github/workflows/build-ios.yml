name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Expo Prebuild (iOS)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 📦 Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: 🔨 Build iOS App (Archive)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME  workspace: $WORKSPACE"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/BooruViewer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            | xcpretty || true
          
          echo "=== Archive contents ==="
          find build/BooruViewer.xcarchive -maxdepth 4 -name "*.app" 2>/dev/null || echo "No .app in archive"

      - name: 📦 Package .ipa file
        run: |
          APP_PATH=$(find build/BooruViewer.xcarchive -name "*.app" | grep -v ".xctest" | head -n 1)
          echo "Found app: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in archive!"
            find build -type d 2>/dev/null | head -30
            exit 1
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "BooruViewer.ipa" Payload
          ls -lh BooruViewer.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruViewer-iOS-IPA
          path: BooruViewer.ipa
          retention-days: 14
