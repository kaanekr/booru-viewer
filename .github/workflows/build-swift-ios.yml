name: Build Swift iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/swift-native"
    paths:
      - "BooruViewerSwift/**"
      - ".github/workflows/build-swift-ios.yml"

permissions:
  contents: read

concurrency:
  group: swift-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5

      - name: 🍎 Select Xcode (26.6 preferred, newest fallback)
        run: |
          set -e
          set -o pipefail
          ls /Applications | grep -i xcode || true

          if [ -d /Applications/Xcode_26.6.app ]; then
            XCODE_APP=/Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not found; falling back to newest available Xcode_*.app"
            XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$XCODE_APP" ] || [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: No Xcode installation found in /Applications"
            ls -la /Applications
            exit 1
          fi

          echo "Using Xcode at: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: 📦 Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: ⚙️ Generate Xcode project
        run: |
          set -e
          cd BooruViewerSwift
          xcodegen generate
          ls -la
          echo "Generated project:"
          ls -d *.xcodeproj

      - name: 🔨 Build unsigned Release for device
        run: |
          set -o pipefail
          cd BooruViewerSwift
          xcodebuild \
            -project BooruViewer.xcodeproj \
            -scheme BooruViewer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log

      - name: 🧾 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-build-log
          path: BooruViewerSwift/build.log
          if-no-files-found: warn

      - name: 📦 Package .ipa file
        run: |
          set -e
          set -o pipefail
          cd BooruViewerSwift
          echo "=== Searching for .app bundle ==="
          APP_PATH=$(find build -name "*.app" -type d | grep -v ".xctest" | head -n 1 || true)
          echo "Found app at: ${APP_PATH:-<none>}"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found under BooruViewerSwift/build!"
            find build -maxdepth 4 -type d
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BooruViewer-Swift.ipa Payload
          ls -lh BooruViewer-Swift.ipa

      - name: 🚀 Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BooruViewer-Swift-IPA
          path: BooruViewerSwift/BooruViewer-Swift.ipa
          retention-days: 14

  test:
    runs-on: macos-26
    needs: build
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5

      - name: 🍎 Select Xcode (26.6 preferred, newest fallback)
        run: |
          set -e
          set -o pipefail
          ls /Applications | grep -i xcode || true

          if [ -d /Applications/Xcode_26.6.app ]; then
            XCODE_APP=/Applications/Xcode_26.6.app
          else
            echo "Xcode_26.6.app not found; falling back to newest available Xcode_*.app"
            XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi

          if [ -z "$XCODE_APP" ] || [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: No Xcode installation found in /Applications"
            ls -la /Applications
            exit 1
          fi

          echo "Using Xcode at: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: 📦 Install XcodeGen
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen --version

      - name: ⚙️ Generate Xcode project
        run: |
          set -e
          cd BooruViewerSwift
          xcodegen generate
          ls -la
          echo "Generated project:"
          ls -d *.xcodeproj

      - name: 🧪 Run unit tests on simulator
        # continue-on-error: true is intentional for the first validation run.
        # Remove it once the simulator test lane is confirmed green.
        continue-on-error: true
        run: |
          set -o pipefail
          cd BooruViewerSwift

          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone (16|15)' | sed -E 's/.*\((iPhone [^(]+)\).*/\1/' | xargs || true)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone 16/15 simulator matched; falling back to any available iPhone"
            DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\((iPhone [^(]+)\).*/\1/' | xargs || true)
          fi

          if [ -z "$DEVICE" ]; then
            echo "ERROR: No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project BooruViewer.xcodeproj \
            -scheme BooruViewer \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: 🧾 Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-ios-test-logs
          path: BooruViewerSwift/build/Logs/Test
          if-no-files-found: warn
